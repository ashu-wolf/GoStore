name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Race tests
        run: go test -race ./...
      - name: Install pinned AWS CLI v2
        env:
          AWSCLI_VERSION: "2.42.4"
        run: |
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-${AWSCLI_VERSION}.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp/awscli
          sudo /tmp/awscli/aws/install --update
          aws --version | grep -q "aws-cli/${AWSCLI_VERSION} "
      - name: AWS CLI compatibility check
        run: bash ./scripts/aws_cli_check.sh
      - name: Container compatibility and persistence check
        run: bash ./scripts/container_check.sh
